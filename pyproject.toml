[project]
name = "app"
version = "0.1.0"
description = "Diseñar y desplegar localmente un sistema utilizable por terceros, con API y app web, siguiendo estándares mínimos de ingeniería"
authors = [
    {name = "Crisberry",email = "myriam.berrio@est.uexternado.edu.co"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.3.2,<3.0.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "ipywidgets (>=8.1.7,<9.0.0)",
    "ipython (>=9.5.0,<10.0.0)",
    "statsmodels (>=0.14.5,<0.15.0)",
    "scipy (>=1.16.2,<2.0.0)",
    "linearmodels (>=6.1,<7.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "fastapi (>=0.117.1,<0.118.0)",
    "uvicorn (>=0.36.0,<0.37.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "streamlit (>=1.49.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "joblib (>=1.5.2,<2.0.0)",
    "pydantic (>=2.11.9,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
